networks:
  internal:
    driver: bridge

# No top-level `volumes:` — persistence is intentionally disabled.
# NOTE (see Architecture §2a): this decision must be revisited once BullMQ is added
# on Day 2 — job queue data has different durability requirements than rate-limit
# counters, and losing in-flight jobs on a Redis restart is a real user-facing failure.
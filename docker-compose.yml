
services:
  redis:
    image: redis:7-alpine
    container_name: seedofcode-llm-redis
    restart: unless-stopped
    command: >
      redis-server
      --save ""
      --appendonly no
      --requirepass ${REDIS_PASSWORD}
    networks:
      - internal
    # No `ports:` block by default if both app and redis are in docker.
    # However, since we are running NestJS locally on the host machine during dev,
    # we MUST expose the port to localhost so the app can connect!
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 3s
      retries: 3

  # app:

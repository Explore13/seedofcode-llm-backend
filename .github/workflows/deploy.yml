name: Deploy to Oracle VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Navigate to the app directory (update if your clone path is different)
            cd ~/seedofcode-llm-backend
            
            # Pull the latest changes from the main branch
            git pull origin main
            
            # Install any new dependencies
            npm install
            
            # Build the NestJS application
            npm run build
            
            # Run TypeORM migrations to apply any database changes
            npm run typeorm migration:run
            
            # Restart the PM2 process to apply the new build
            pm2 restart seedofcode-llm

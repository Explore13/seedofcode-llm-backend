name: Deploy to Oracle VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Exit immediately if any command exits with a non-zero status.
            # This prevents subsequent commands from running if a previous one fails.
            set -e

            # Navigate to the application directory on the server
            cd ~/seedofcode-llm-backend

            # Fetch the latest commits from the remote repository
            git fetch --all

            # Force the local repository to exactly match the remote 'main' branch,
            # discarding any accidental local changes (like package-lock.json)
            git reset --hard origin/main

            # Install any new or updated dependencies
            npm install

            # Build the NestJS application
            npm run build

            # Run TypeORM migrations to apply any pending database schema changes
            npm run typeorm migration:run

            # Restart the existing PM2 process to start serving the new build
            pm2 restart seedofcode-llm
